name: "Agent 2: Backup keeper"

# Supabase's free tier does not include automatic backups — that's only on
# paid plans. This closes that real gap for free: once a week, it takes a
# full snapshot of your database and stores it privately in this repository
# as a workflow artifact, encrypted at rest by GitHub, visible only to you.
on:
  schedule:
    - cron: "0 3 * * 0" # every Sunday
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install matching PostgreSQL 17 client tools
        # Ubuntu's default package repository only ships an older
        # postgresql-client, which pg_dump refuses to use against a newer
        # database server. This adds PostgreSQL's own official repository
        # so the installed pg_dump version actually matches (or exceeds)
        # the Supabase project's server version.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump database
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_CONNECTION_STRING }}" \
            --no-owner --no-privileges -F c -f signal-deck-backup.dump
      - name: Upload backup
        uses: actions/upload-artifact@v7
        with:
          name: signal-deck-backup-${{ github.run_id }}
          path: signal-deck-backup.dump
          retention-days: 90
